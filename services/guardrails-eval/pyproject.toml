[project]
name = "rag-svc-guardrails-eval"
version = "0.0.0"
description = "RAG as a Service service module: guardrails-eval."
requires-python = ">=3.11"
# PyYAML is for the Phase-11 gold-set loader only (`suite.load_suite`). The plan writes the path
# as `eval/gold/<doc>.yaml`, and YAML is the right format for THIS file: a gold set is hand-edited
# and reviewed, and a reviewer annotating why an item is `should` rather than `must` needs
# comments, which JSON cannot carry. Pure-Python, MIT, no native build, no egress.
dependencies = [
    "rag-common",
    "rag-schemas",
    "rag-core",
    "rag-clients",
    "fastapi>=0.111",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_guardrails_eval"]
