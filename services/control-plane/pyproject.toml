[project]
name = "rag-svc-control-plane"
version = "0.0.0"
description = "RAG as a Service service module: control-plane."
requires-python = ">=3.11"
dependencies = ["rag-common", "rag-schemas", "rag-core", "rag-clients", "fastapi>=0.111", "sqlglot>=25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_control_plane"]
