[project]
name = "rag-svc-retrieval"
version = "0.0.0"
description = "RAG as a Service service module: retrieval."
requires-python = ">=3.11"
dependencies = ["rag-common", "rag-schemas", "rag-core", "rag-clients", "fastapi>=0.111"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_retrieval"]
