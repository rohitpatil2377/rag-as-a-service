# gaps and no retrieval misses. The two that still fail the answer score therefore fail at
# GENERATION, with the evidence in front of the model.
#
#   uv run python scripts/eval_gate.py --kb <kb> --suite eval/gold/aegcl_corrigendum.yaml --repeat 3

