[project]
name = "rag-core"
version = "0.0.0"
description = "RAG as a Service — hand-rolled RAG interfaces (Protocols) + pure logic. NO heavy RAG framework."
requires-python = ">=3.11"
# Deliberately dependency-light: interfaces + pure algorithms only. Concrete store
# drivers live in rag-clients. This is the self-owned contract that avoids
# framework lock-in (ADR-0002).
dependencies = ["pydantic>=2.7", "rag-schemas", "rag-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
