# Alembic config for RAG as a Service Postgres migrations.
# The DB URL is injected from RAG_POSTGRES_DSN at runtime (env.py) — never hard-coded.
# Run via `make migrate` (uv run alembic -c libs/clients/alembic.ini upgrade head).
[alembic]
script_location = libs/clients/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
