[project]
name = "rag-common"
version = "0.0.0"
description = "RAG as a Service — cross-cutting foundation: config, logging, tracing, errors, tenancy, auth, secrets."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "structlog>=24.1",
    "fastapi>=0.111",
    "pyjwt>=2.8",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

# Multi-replica scale-out (shared rate limiter / cache-coherence / scheduler leader lock)
# uses Redis when RAG_REDIS_URL is set. Import-guarded and off by default — install with
# `uv sync --extra scale` (or `pip install 'rag-common[scale]'`) only when scaling out.
[project.optional-dependencies]
scale = ["redis>=5.0"]
# On-prem AD/LDAP bind login (banking pack) — enable with RAG_LDAP_ENABLED + RAG_LDAP_SERVER.
ldap = ["ldap3>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_common"]
