[project]
name = "rag-schemas"
version = "0.0.0"
description = "RAG as a Service — shared pydantic data contracts (envelope, chunk, retrieval, citation, audit)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_schemas"]
