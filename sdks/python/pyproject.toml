[project]
name = "rag-sdk"
version = "0.1.0"
description = "RAG as a Service — official Python SDK (sovereign, typed client for the /v1 API)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_sdk"]
