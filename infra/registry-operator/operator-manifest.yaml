apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-system
  labels: { rag.local/plane: federation }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-operator
  namespace: sovereign-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sovereign-registry-operator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sovereign-registry-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sovereign-registry-operator
subjects:
  - kind: ServiceAccount
    name: registry-operator
    namespace: sovereign-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-operator
  namespace: sovereign-system
  labels: { app.kubernetes.io/name: registry-operator, app.kubernetes.io/part-of: sovereign-federation }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: registry-operator } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry-operator }
    spec:
      serviceAccountName: registry-operator
      containers:
        - name: operator
          image: registry.local/ragaas/api:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/python3", "/operator/registry_operator.py"]
          env:
            - { name: INTERVAL_SECONDS, value: "30" }
            - { name: DEV_SECRET, value: "dev-only-insecure-secret-change-me-32b+" }
          volumeMounts:
            - { name: script, mountPath: /operator, readOnly: true }
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: script
          configMap: { name: registry-operator-script }
