{{- if .Values.observability.enabled }}
# =============================================================================================
# Self-contained observability sub-stack (OPTIONAL, default OFF — set observability.enabled=true).
#
# Mirrors the Compose topology: api --OTLP--> otel-collector --(prometheus exporter :8889)-->
# prometheus <--scrape-- ; grafana provisioned with the Prometheus datasource + the SAME dashboards
# the Compose stack ships (incl. the RAGAS governance dashboard). SOVEREIGN: no community Helm
# charts are pulled at deploy time — every manifest is in-chart and the configs are the EXACT files
# infra/otel, infra/prometheus and infra/grafana already carry (copied under files/observability/).
#
# When OFF the render is byte-identical to a no-observability deploy (mirrors global.linkerd.enabled).
#
# Reachability: api -> otel-collector:4317 is admitted by the rag-api-egress NetworkPolicy via the
# gated rule keyed on rag.local/observability="true" (see api.yaml). collector<->prometheus and
# grafana->prometheus are intra-namespace and already admitted by the namespace-egress policy.
# Grafana is NOT exposed publicly: reach it via `kubectl port-forward svc/grafana 3000:3000` or an
# optional Ingress. Admin password comes from a Secret (never inline in the Deployment env).
#
# Managed-observability alternative: leave observability.enabled=false and point the api's
# RAG_OTEL_EXPORTER_OTLP_ENDPOINT at an external collector (label its namespace
# rag.local/plane=observability so the api egress policy admits it).
# =============================================================================================
---
# --- otel-collector config (verbatim from infra/otel/collector.yaml) --------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-otel-collector-config
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
{{ .Files.Get "files/observability/otel-collector.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        {{- include "rag.labels" . | nindent 8 }}
        app.kubernetes.io/name: otel-collector
        # Admitted by the api egress policy so the api can export OTLP on 4317 (see api.yaml).
        rag.local/observability: "true"
      {{- if eq (include "rag.linkerdEnabled" .) "true" }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ .Values.observability.collector.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: prom, containerPort: 8889 }
          resources:
            {{- toYaml .Values.observability.collector.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
      volumes:
        - name: config
          configMap: { name: rag-otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: prom, port: 8889, targetPort: prom }
---
# --- prometheus config (verbatim from infra/prometheus/prometheus.yml) ------------------------
# NOTE: the copied file keeps the compose "ragas-textfile" job (node-exporter:9100); there is no
# in-cluster node-exporter, so that ONE scrape target stays DOWN in K8s (harmless — Prometheus
# tolerates down targets). The otel-collector:8889 job is the live metrics path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-prometheus-config
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
{{ .Files.Get "files/observability/prometheus.yml" | indent 4 }}
{{- if .Values.observability.prometheus.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.observability.prometheus.persistence.storageClass }}
  storageClassName: {{ .Values.observability.prometheus.persistence.storageClass | quote }}
  {{- else if .Values.stores.storageClass }}
  storageClassName: {{ .Values.stores.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.observability.prometheus.persistence.storage | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        {{- include "rag.labels" . | nindent 8 }}
        app.kubernetes.io/name: prometheus
      {{- if eq (include "rag.linkerdEnabled" .) "true" }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      securityContext:
        fsGroup: 65534            # nobody: Prometheus writes its TSDB to /prometheus
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.observability.prometheus.retention }}"
          ports:
            - { name: http, containerPort: 9090 }
          resources:
            {{- toYaml .Values.observability.prometheus.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: rag-prometheus-config }
        - name: data
          {{- if .Values.observability.prometheus.persistence.enabled }}
          persistentVolumeClaim: { claimName: prometheus-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - { name: http, port: 9090, targetPort: http }
---
# --- grafana datasource + dashboard provisioning (verbatim from infra/grafana) ----------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-datasources
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
data:
  datasource.yml: |
{{ .Files.Get "files/observability/grafana/datasources/datasource.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-dashboards-provider
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
data:
  dashboards.yml: |
{{ .Files.Get "files/observability/grafana/dashboards-provider/dashboards.yml" | indent 4 }}
---
# The dashboard JSON files (overview + federation + RAGAS governance) as a single ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-grafana-dashboards
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
data:
  {{- (.Files.Glob "files/observability/grafana/dashboards/*.json").AsConfig | nindent 2 }}
---
# Grafana admin password lives in a Secret (never inline in the Deployment env).
apiVersion: v1
kind: Secret
metadata:
  name: rag-grafana-admin
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-password: {{ .Values.observability.grafana.adminPassword | quote }}
{{- if .Values.observability.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.observability.grafana.persistence.storageClass }}
  storageClassName: {{ .Values.observability.grafana.persistence.storageClass | quote }}
  {{- else if .Values.stores.storageClass }}
  storageClassName: {{ .Values.stores.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.observability.grafana.persistence.storage | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        {{- include "rag.labels" . | nindent 8 }}
        app.kubernetes.io/name: grafana
      {{- if eq (include "rag.linkerdEnabled" .) "true" }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      securityContext:
        fsGroup: 472              # grafana uid: writes its sqlite DB to /var/lib/grafana
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-grafana-admin
                  key: admin-password
            - { name: GF_USERS_DEFAULT_THEME, value: "light" }   # brand: light-dominant
          ports:
            - { name: http, containerPort: 3000 }
          resources:
            {{- toYaml .Values.observability.grafana.resources | nindent 12 }}
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: datasources
          configMap: { name: rag-grafana-datasources }
        - name: dashboards-provider
          configMap: { name: rag-grafana-dashboards-provider }
        - name: dashboards
          configMap: { name: rag-grafana-dashboards }
        - name: data
          {{- if .Values.observability.grafana.persistence.enabled }}
          persistentVolumeClaim: { claimName: grafana-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - { name: http, port: 3000, targetPort: http }
{{- end }}
