{{- if .Values.stores.enabled }}
{{- $sc := .Values.stores.storageClass }}
# =============================================================================================
# Per-department stores. Each department gets its OWN isolated vector/sparse/object/metadata
# store (the pitch's "isolated vector databases for each department"). Pods carry
# rag.local/store="true" so the API egress NetworkPolicy admits them and nothing else.
#
# LINKERD DECISION: these stores are deliberately LEFT UNMESHED (no linkerd.io/inject annotation
# on the StatefulSet pods), a common and valid choice. Rationale: (1) they are StatefulSets
# speaking NON-HTTP wire protocols — postgres (5432) is server-speaks-first and would hang under
# linkerd's HTTP protocol detection unless carefully handled; qdrant/opensearch/minio are HTTP but
# stateful, and sidecar lifecycle/ordering on a stateful pod adds real operational risk; (2) the
# api↔store hop NEVER leaves the department namespace and is already fenced by the rag.local/store
# selector + the rag-api-egress + namespace-egress NetworkPolicies, so it is not an untrusted hop.
# linkerd's defence-in-depth mTLS is applied where it earns its keep — the SERVICE-to-service hops
# (api↔node, api↔console, cross-namespace federation). The meshed api still reaches these unmeshed
# stores via its own outbound proxy; postgres:5432 is marked opaque on the api (see api.yaml) so the
# proxy does transparent TCP instead of protocol detection. To mesh a store later, add the inject
# annotation here + list its non-HTTP port in config.linkerd.io/opaque-ports, mirroring the node.
# =============================================================================================
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        rag.local/store: "true"
    spec:
      containers:
        - name: postgres
          image: {{ .Values.stores.postgres.image | quote }}
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.stores.postgres.db | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.stores.postgres.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.stores.postgres.password | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.stores.postgres.storage | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: qdrant }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        rag.local/store: "true"
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.stores.qdrant.image | quote }}
          ports: [{ name: http, containerPort: 6333 }]
          volumeMounts: [{ name: data, mountPath: /qdrant/storage }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.stores.qdrant.storage | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: qdrant }
  ports: [{ name: http, port: 6333, targetPort: http }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: opensearch }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        rag.local/store: "true"
    spec:
      containers:
        - name: opensearch
          image: {{ .Values.stores.opensearch.image | quote }}
          ports: [{ name: http, containerPort: 9200 }]
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: {{ .Values.stores.opensearch.javaOpts | quote }} }
          volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.stores.opensearch.storage | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: opensearch }
  ports: [{ name: http, port: 9200, targetPort: http }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        rag.local/store: "true"
    spec:
      containers:
        - name: minio
          image: {{ .Values.stores.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: MINIO_ROOT_USER, value: {{ .Values.stores.minio.rootUser | quote }} }
            - { name: MINIO_ROOT_PASSWORD, value: {{ .Values.stores.minio.rootPassword | quote }} }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.stores.minio.storage | quote }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: {{- include "rag.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
{{- end }}
