{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-console
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: rag-console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-console
  template:
    metadata:
      labels:
        {{- include "rag.labels" . | nindent 8 }}
        app.kubernetes.io/name: rag-console
      {{- if eq (include "rag.linkerdEnabled" .) "true" }}
      annotations:
        # Mesh the console: nginx serves the static SPA on :80 (HTTP) and reverse-proxies /v1 to the
        # api on :8000 (HTTP). BOTH hops are plain HTTP, so they are meshed NORMALLY — no opaque-ports
        # are needed for the console. The api↔console mTLS is the point of meshing this tier.
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      # The console image is a root nginx serving a static SPA (no secrets, no data). It binds :80,
      # so it is not forced non-root here; the API — the sensitive tier — runs as non-root uid 10001.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "rag.consoleImage" . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.console.service.port }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          # The stock nginx entrypoint chowns its cache + drops to the nginx user, so it needs the
          # default root caps (CHOWN/SETUID/SETGID). Left at image defaults; this tier serves only
          # static files. The API — the sensitive tier — keeps drop-ALL + read-only rootfs.
---
apiVersion: v1
kind: Service
metadata:
  name: rag-console
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/name: rag-console
spec:
  selector:
    app.kubernetes.io/name: rag-console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
{{- end }}
