# gpu2 distributed deploy — SANITIZED EXAMPLE (no real secrets).
# Copy to values-gpu2.yaml (gitignored) and fill every CHANGE_ME before `helm install`.
# RAG stack runs in k3s here; LLM served on gpu1 (192.0.2.10) via vLLM.
global:
  imagePullPolicy: IfNotPresent
department: acme
api:
  replicas: 1
  autoscaling: { enabled: false }
  image: registry.local/ragaas/api:local
  externalEgress:
    - cidr: 192.0.2.10/32
      ports: [8000]
  config:
    RAG_LLM_BACKEND: "vllm"
    RAG_VLLM_URL: "http://192.0.2.10:8000/v1"
    RAG_LLM_MODEL: "PLACEHOLDER_SET_FROM_GPU1"
    RAG_ALLOWED_EGRESS_HOSTS: "localhost,qdrant,opensearch,minio,postgres,tei,reranker,nli-checker,otel-collector,192.0.2.10"
  secrets:
    RAG_POSTGRES_DSN: "postgresql+psycopg://rag:CHANGE_ME@postgres:5432/rag"
    RAG_MINIO_ACCESS_KEY: "CHANGE_ME"
    RAG_MINIO_SECRET_KEY: "CHANGE_ME"
    RAG_GRANT_SIGNING_KEY: "CHANGE_ME_BASE64_ED25519"
    RAG_GRANT_SIGNING_KEY_ID: "2026-a"
console:
  replicas: 1
  image: registry.local/ragaas/console:local
stores:
  enabled: true
  postgres: { password: "CHANGE_ME" }
  minio: { rootUser: "CHANGE_ME", rootPassword: "CHANGE_ME" }
selfHostedModels:
  enabled: true
  llmEnabled: false
sovereign-node:
  enabled: false
