{{- if .Values.identity.keyPem }}
# mTLS / libp2p identity key injection (STUB).
#
# The node needs a STABLE Ed25519 identity so its peer id survives restarts and can be pinned
# in other departments' bootstrap lists and in grant records. This Secret carries that key.
#
# PRODUCTION: do NOT put a raw key in values.yaml committed to git. Either:
#   - manage this Secret out-of-band (Sealed Secrets / External Secrets / Vault) and set only
#     `identity.secretName` so the Deployment mounts the pre-existing Secret, OR
#   - inject `identity.keyPem` at install time from a secure source (--set-file), which renders
#     this template.
# This stub exists so the wiring (mount path /etc/sovereign/identity/node.key) is visible.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sovereign-node.identitySecretName" . }}
  labels:
    {{- include "sovereign-node.labels" . | nindent 4 }}
type: Opaque
stringData:
  node.key: |-
    {{- .Values.identity.keyPem | nindent 4 }}
{{- end }}
