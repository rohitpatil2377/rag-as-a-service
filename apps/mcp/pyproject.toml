[project]
name = "rag-mcp"
version = "0.0.0"
description = "RAG as a Service — sovereign MCP server (FR-H2). Exposes retrieve/query as agent tools over the pipeline."
requires-python = ">=3.11"
dependencies = [
    "rag-common",
    "rag-schemas",
    "rag-svc-control-plane",
    "mcp>=1.2",
]

[project.scripts]
rag-mcp = "rag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]
