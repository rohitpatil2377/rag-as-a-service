[project]
name = "rag-api"
version = "0.0.0"
description = "RAG as a Service — Phase-0 modular-monolith API. Mounts every service module in one process (ADR-0001)."
requires-python = ">=3.11"
dependencies = [
    "rag-common",
    "rag-schemas",
    "rag-core",
    "rag-clients",
    "rag-svc-ingestion",
    "rag-svc-doc-intelligence",
    "rag-svc-indexing",
    "rag-svc-retrieval",
    "rag-svc-generation",
    "rag-svc-guardrails-eval",
    "rag-svc-control-plane",
    "rag-mcp",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
rag-api = "rag_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
