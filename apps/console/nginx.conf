# Serves the built SPA and reverse-proxies the API on the same origin, so the console
# calls /v1 and /health with no CORS and no hard-coded backend host (see src/lib/api.ts,
# which uses relative paths). `api` resolves via the compose network's DNS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version banner (info-leak hardening, VAPT).
    server_tokens off;

    # Keep redirects RELATIVE. This container listens on 80 but is published on host :8082;
    # nginx's default absolute_redirect would rewrite a redirect to an absolute URL using its own
    # port (dropping :8082), sending the browser to :80/:443 — the wrong (neighbouring) service.
    absolute_redirect off;

    # Document uploads are base64 JSON, so a multi-page PDF easily exceeds nginx's 1 MB
    # default and would 413 before reaching the API. Allow real documents through.
    # 2g covers a ~1 GB raw file after base64 expansion (~1.37x) plus JSON overhead;
    # keep this in step with the front proxy's client_max_body_size and the UI's 413 copy.
    # (Beyond ~1 GB use object-store by-reference ingest — base64 upload gets wasteful.)
    client_max_body_size 2g;
    # A ~1 GB upload over a slow link takes well over the 60s default to send, and the API
    # then spends minutes extracting/embedding — raise both the body-read and upstream timeouts.
    client_body_timeout 1800s;

    # SPA: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for the HTML app (VAPT hardening). The proxied /v1, /health and
        # /mcp responses get their own headers from the API middleware, so we set these only
        # on the static SPA to avoid duplicate header values.
        # CSP: the app's own assets are same-origin ('self'); inline styles are used heavily
        # (Tailwind + React style props) so style-src needs 'unsafe-inline'; Google Fonts is
        # allowlisted (self-hosting the fonts is the sovereignty follow-up).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Always revalidate before serving from cache, so a redeploy's new asset hashes are picked
        # up immediately (index.html revalidates every load; content-hashed /assets/* 304 if
        # unchanged). Prevents stale-bundle bugs where a browser runs old JS after a deploy.
        add_header Cache-Control "no-cache" always;
    }

    # Docker's embedded DNS, and the API address as a VARIABLE. Without both, nginx resolves
    # "api" ONCE at startup and pins that IP for the life of the worker. Observed live: the API
    # containers were recreated, api-d took the IP the old api had held, and every console request
    # went to a DIFFERENT department's API for an hour — same image, different configuration, so
    # the Models page reported a backend and an endpoint that no longer existed anywhere.
    # A variable in proxy_pass is what makes nginx re-resolve per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rag_api "http://api:8000";

    # Control-plane API (tenant-scoped /v1 surface). Buffering off so Server-Sent
    # Events (streamed answers) reach the browser token-by-token, not in one chunk.
    location /v1/ {
        proxy_pass $rag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Liveness (used by the console's connectivity check).
    location /health {
        proxy_pass $rag_api/health;
    }

    # Agent surface: multi-tenant MCP over streamable HTTP (JWT-authenticated).
    location /mcp {
        proxy_pass $rag_api;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # API docs. The OpenAPI spec is proxied from the API; the Swagger UI is served LOCALLY from
    # /apidocs/ (bundled assets, no CDN) so it renders on a locked-down/sovereign network — the
    # default FastAPI /docs loads Swagger's JS from a CDN and shows a blank page when that's blocked.
    # /docs redirects to the self-contained page. "Try it out" still needs a dev token for authed calls.
    # Standalone sovereign-access crypto demo at a clean /govern path (serves demo.html; its
    # external demo.js is same-origin so the SPA's `script-src 'self'` CSP allows it).
    location = /govern { alias /usr/share/nginx/html/demo.html; default_type text/html; }

    location = /openapi.json { proxy_pass $rag_api/openapi.json; proxy_set_header Host $host; }
    # /api is the primary, org-convention entry to the interactive API reference (same origin,
    # same port as the app). /docs and /redoc are kept as aliases to the same self-hosted page.
    location = /api   { return 302 /apidocs/index.html; }
    location = /api/  { return 302 /apidocs/index.html; }
    location = /docs  { return 302 /apidocs/index.html; }
    location = /redoc { return 302 /apidocs/index.html; }

    # The Swagger UI page needs to run its own (inline) init + Swagger's runtime, which the SPA's
    # strict `script-src 'self'` CSP blocks (→ blank page). Scope a relaxed CSP to /apidocs/ ONLY —
    # the SPA keeps its strict policy. Still fully same-origin: no external hosts, no CDN.
    location ^~ /apidocs/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The sign-in intro splash runs its own inline animation script and is embedded by the login
    # page in a same-origin iframe — both blocked by the SPA's strict CSP (script-src 'self') and
    # X-Frame-Options: DENY. Scope a relaxed policy to this ONE file: allow its inline script and
    # same-origin framing. Every other route keeps the strict policy. Still fully same-origin.
    location = /ragaas-intro.html {
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
